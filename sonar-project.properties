sonar.organization=wilsonfaustino
sonar.projectKey=wilsonfaustino_tower
sonar.projectName=tower

sonar.sources=App,Core
sonar.tests=CoreTests,AppTests
sonar.exclusions=**/*.xcassets/**,**/*.icon/**,CoreTests/Fixtures/**
sonar.test.exclusions=CoreTests/Fixtures/**

# Layout only, no logic to test:
# QueueRowView.swift: queue row layout and its selected and hovered colors.
# QueueSectionView.swift: section header layout.
# StateViews.swift: empty, offline and auth banner layout.
sonar.coverage.exclusions=App/QueueRowView.swift,App/QueueSectionView.swift,App/StateViews.swift
sonar.coverageReportPaths=build/coverage.xml
# Fail the sonarqube job when the quality gate fails, so branch protection can require it.
sonar.qualitygate.wait=true
