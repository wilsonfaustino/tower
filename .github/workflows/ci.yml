name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-test:
    # Xcode 27 is only on this image (public preview). macos-26 tops out at Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: |
          xcodebuild -scheme Tower -destination 'platform=macOS' \
            -enableCodeCoverage YES -resultBundlePath build/Test.xcresult test

      - name: Convert coverage
        run: scripts/xccov-to-sonarqube-generic.sh build/Test.xcresult > build/coverage.xml

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: build/coverage.xml

  sonarqube:
    needs: build-and-test
    # Fork PRs get no secrets, so skip analysis there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Coverage paths are absolute, so analysis runs on macOS with the same workspace path.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage
          path: build

      - uses: SonarSource/sonarqube-scan-action@v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
